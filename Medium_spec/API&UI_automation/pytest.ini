[pytest]
minversion = 7.0
addopts = -ra -q --strict-markers
pythonpath = . api ui
testpaths =
    api/tests
    ui/tests
markers =
    ui: Playwright Browser UI tests
    api: API contract and functional tests
    acr: Assignment Change Request tests
    approval: In-app and email approval flows
    guards: Operational constraints and boundary checks
    concurrency: Concurrency race condition tests
    contract: API schema and type contract tests
    security: Token security and RBAC tests
    statemachine: State transition integrity tests
    pagination: Pagination and query filtering tests
    accessibility: UI accessibility and WCAG tests
    regression: Downstream sync and regression tests
