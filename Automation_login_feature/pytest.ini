[pytest]
minversion = 7.0
addopts = -ra -q --strict-markers
testpaths =
    api/tests
    database/tests
    ui/tests
markers =
    ui: Playwright Browser UI tests
    api: API contract and functional tests
    db: Database integrity and constraint tests
    auth: Core authentication tests
    validation: Client and server-side validation tests
    mfa: Multi-factor authentication tests
    sso: Corporate Single Sign-On tests
    security: Security, boundary, and rate limiting tests
    isolation: Cross-context and multi-tenant isolation tests
    session: Next.js session bridge and cookie tests
    route_protection: Route middleware and redirect guard tests
    fault_tolerance: Graceful degradation and offline tests
    branding: Dynamic tenant branding tests
